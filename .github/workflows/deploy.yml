name: Sync & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  schedule:
    # 每天 UTC 0:00 (北京时间早上 8:00) 自动检查并同步上游
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页手动点击运行

# 赋予 GitHub Action 修改仓库代码的写权限
permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整提交历史，方便代码合并

      - name: Sync with Upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 记录同步前的 Commit ID
          BEFORE=$(git rev-parse HEAD)
          
          # 使用 GitHub 官方 CLI 同步上游 upstream 仓库的 main 分支
          gh repo sync ${{ github.repository }} -b main || true
          
          # 拉取最新的 main 分支代码到本地
          git pull origin main
          
          # 记录同步后的 Commit ID
          AFTER=$(git rev-parse HEAD)
          
          # 判断是否有代码更新（或者是否为非定时调用的手动触发）
          if [ "$BEFORE" != "$AFTER" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "检测到代码有更新或手动触发，准备执行构建与部署。"
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "上游仓库暂无新代码更新，跳过后续部署步骤。"
          fi

      - name: Install pnpm
        if: steps.sync.outputs.updated == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        if: steps.sync.outputs.updated == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.sync.outputs.updated == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build Project
        if: steps.sync.outputs.updated == 'true'
        run: pnpm build

      - name: Deploy
        if: steps.sync.outputs.updated == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:ci
